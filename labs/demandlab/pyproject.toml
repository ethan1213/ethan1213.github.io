[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "demandlab"
version = "0.1.0"
description = "MVP de investigación de pronóstico de demanda con evaluación temporal reproducible"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
demandlab = "demandlab.__main__:main"

[tool.setuptools.packages.find]
include = ["demandlab*"]
